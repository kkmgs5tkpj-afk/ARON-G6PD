<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>G6PD MedSafe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #17324d;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    input {
      flex: 1;
      padding: 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 16px 24px;
      border: none;
      border-radius: 10px;
      background: #17324d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .hidden {
      display: none;
    }

    .risk {
      display: inline-block;
      padding: 9px 15px;
      border-radius: 20px;
      font-weight: bold;
      margin: 10px 0 15px;
    }

    .high {
      background: #fee2e2;
      color: #b91c1c;
    }

    .medium {
      background: #ffedd5;
      color: #c2410c;
    }

    .unknown {
      background: #e5e7eb;
      color: #374151;
    }

    .disclaimer {
      margin-top: 25px;
      padding: 15px;
      background: #fff7ed;
      border-radius: 10px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>G6PD MedSafe</h1>
  <p>Medication Safety Checker for G6PD Deficiency</p>
</header>

<main>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="Search medication..."
    >

    <button onclick="searchDrug()">
      Search
    </button>
  </div>

  <div id="result" class="card hidden"></div>

  <div class="disclaimer">
    <strong>Important:</strong>
    This project is for educational and reference purposes.
    It does not replace professional medical advice,
    official prescribing information, or clinical judgment.
  </div>

</main>

<script>

async function loadDrugs() {

  try {

    const response = await fetch("data/drugs.json");

    if (!response.ok) {
      throw new Error("Could not load database");
    }

    const data = await response.json();

    window.drugs = data.drugs || [];

  } catch (error) {

    console.error(error);

    window.drugs = [];

  }
}


async function searchDrug() {

  if (!window.drugs) {
    await loadDrugs();
  }

  const input = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  const result = document.getElementById("result");

  result.classList.remove("hidden");

  if (!input) {

    result.innerHTML = 
      <h2>Please enter a medication name.</h2>
    ;

    return;
  }

  const drug = window.drugs.find(d => {

    const name = (d.generic_name || "").toLowerCase();

    const synonyms = (d.synonyms || [])
      .map(s => s.toLowerCase());

    return name.includes(input) ||
           synonyms.some(s => s.includes(input));

  });
